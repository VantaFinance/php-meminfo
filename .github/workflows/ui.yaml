name: Browser UI

# A Node project of its own, tested apart from the PHP matrix and published to
# GitHub Pages from master. The built app is static and needs no server: the
# dump never leaves the visitor's browser, so Pages only serves files.
on:
  push:
    paths:
      - 'ui/**'
      - '.github/workflows/ui.yaml'
  pull_request:
    paths:
      - 'ui/**'
      - '.github/workflows/ui.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Engine tests
        run: npm test

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds dist/ and tests that very build: what Pages serves is what was tested.
      - name: End-to-end and memory tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-playwright-report
          path: |
            ui/playwright-report
            ui/test-results

      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ui/dist

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time; a newer push does not cancel one in flight.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
